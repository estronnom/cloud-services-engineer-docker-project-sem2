name: Docker Project Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest

  run-with-docker-compose:
    name: Run with docker compose
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare .env files
        run: |
            # In production fill .env files with actual values provided by CI variables
            cp .env.be.example .env.be
            cp .env.fe.example .env.fe
            cp .env.common.example .env.common
      - name: Prepare secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          mkdir -p secrets
          printf '%s' "$API_KEY" > secrets/api-keys.json

      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0
        with:
          compose-file: ./compose.yml # v2.2.0 of compose-action expects legacy compose file name, pin it explicitly

  run-trivy-checks:
    name: Run Trivy checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: momo-store-be
          - name: frontend
            context: ./frontend
            image: momo-store-fe

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.image }}:local

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:local
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true # ignore cves with no fix available
